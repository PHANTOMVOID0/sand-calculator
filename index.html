<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c98a1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="বালুর হিসাব">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ট্রাকে বালুর হিসাব</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--text:#1f1b14;--muted:#6b6354;--accent:#c98a1b;--accent-text:#fff;--line:#e0d9c8;--res:#fbf1da;--sand:#d9b26a;--truck:#3b6ea5;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e16;--text:#f3ecdc;--muted:#a79e8b;--accent:#e0a233;--accent-text:#1a1306;--line:#3a3325;--res:#2e2515;--sand:#c9a05a;--truck:#5b8fc7;--danger:#e57464}}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e16;--text:#f3ecdc;--muted:#a79e8b;--accent:#e0a233;--accent-text:#1a1306;--line:#3a3325;--res:#2e2515;--sand:#c9a05a;--truck:#5b8fc7;--danger:#e57464}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:8px 0 14px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label.t{display:block;font-size:14px;color:var(--muted);margin:14px 0 4px}
label.t:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.u{position:relative}
.u span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
input,select{width:100%;font-size:18px;padding:12px 48px 12px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
select,#c{padding-right:12px}
.res{background:var(--res);border-color:var(--accent)}
.big{font-size:34px;font-weight:700;color:var(--accent)}
.line{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
button{width:100%;padding:12px;font-size:16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);font-weight:600;margin-top:12px}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.sm{width:auto;padding:4px 10px;font-size:13px;margin:0;background:transparent;color:var(--danger);border:1px solid var(--line)}
svg{width:100%;height:auto;display:block}
.sand{fill:var(--sand);transform-box:fill-box;transform-origin:bottom;transition:transform .45s ease}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bounce{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.pct{text-align:center;font-weight:600;margin-top:4px}
.warn{color:var(--danger)}
.opt{font-size:12px;color:var(--muted);font-weight:400}
.h{border-top:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.55}
.h:first-of-type{border-top:0}
.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){.spin,.bounce{animation:none}.sand{transition:none}}
</style>
</head>
<body>
<main>
<h1>🚚 ট্রাকে বালুর হিসাব</h1>

<div class="card">
  <svg viewBox="0 0 330 130" role="img" aria-label="ট্রাকে বালু ভরার ছবি">
    <defs><clipPath id="bedClip"><rect x="12" y="24" width="206" height="66"/></clipPath></defs>
    <g class="bounce">
      <rect x="12" y="24" width="206" height="66" fill="none"/>
      <g clip-path="url(#bedClip)"><rect id="sandR" class="sand" x="12" y="24" width="206" height="66"/></g>
      <path d="M10 22 V92 H220 V22" fill="none" stroke="var(--truck)" stroke-width="5" stroke-linejoin="round"/>
      <rect x="6" y="92" width="318" height="9" rx="3" fill="var(--truck)"/>
      <path d="M226 46 H268 L300 72 V92 H226 Z" fill="var(--truck)"/>
      <path d="M236 53 H265 L285 70 H236 Z" fill="var(--bg)"/>
    </g>
    <g>
      <g transform="translate(55 107)"><circle r="15" fill="var(--text)"/><g class="spin"><path d="M-10 0H10M0 -10V10" stroke="var(--bg)" stroke-width="3"/></g></g>
      <g transform="translate(115 107)"><circle r="15" fill="var(--text)"/><g class="spin"><path d="M-10 0H10M0 -10V10" stroke="var(--bg)" stroke-width="3"/></g></g>
      <g transform="translate(270 107)"><circle r="15" fill="var(--text)"/><g class="spin"><path d="M-10 0H10M0 -10V10" stroke="var(--bg)" stroke-width="3"/></g></g>
    </g>
  </svg>
  <div class="pct" id="pct">০%</div>
</div>

<div class="card">
  <label class="t">ট্রাক বেডের দৈর্ঘ্য</label>
  <div class="row">
    <div class="u"><input id="lf" type="number" inputmode="decimal" value="15"><span>ফুট</span></div>
    <div class="u"><input id="li" type="number" inputmode="decimal" value="11"><span>ইঞ্চি</span></div>
  </div>
  <label class="t">ট্রাক বেডের প্রস্থ</label>
  <div class="row">
    <div class="u"><input id="wf" type="number" inputmode="decimal" value="6"><span>ফুট</span></div>
    <div class="u"><input id="wi" type="number" inputmode="decimal" value="6"><span>ইঞ্চি</span></div>
  </div>
  <label class="t">পাশের উচ্চতা</label>
  <div class="row">
    <div class="u"><input id="hf" type="number" inputmode="decimal" value="7"><span>ফুট</span></div>
    <div class="u"><input id="hi" type="number" inputmode="decimal" value="7"><span>ইঞ্চি</span></div>
  </div>
  <label class="t">বালু ভরার উচ্চতা <span class="opt">(খালি রাখলে পুরো ভরা)</span></label>
  <div class="row">
    <div class="u"><input id="ff" type="number" inputmode="decimal" placeholder="০"><span>ফুট</span></div>
    <div class="u"><input id="fi" type="number" inputmode="decimal" placeholder="০"><span>ইঞ্চি</span></div>
  </div>
  <label class="t">বালুর ধরন (পাউন্ড/ঘনফুট)</label>
  <select id="s">
    <option value="100">শুকনো বালু – ১০০</option>
    <option value="110" selected>ভেজা ভেজা বালু – ১১০</option>
    <option value="120">ভিজা বালু – ১২০</option>
    <option value="custom">নিজে দিন…</option>
  </select>
  <div id="cw" style="display:none"><label class="t">নিজের ঘনত্ব (পাউন্ড/ঘনফুট)</label><input id="c" type="number" inputmode="decimal" value="105"></div>
  <label class="t">দাম <span class="opt">(ঐচ্ছিক, না দিলে টাকার হিসাব হবে না)</span></label>
  <div class="row">
    <div class="u"><input id="p" type="number" inputmode="decimal" placeholder="০"><span>৳</span></div>
    <select id="pu"><option value="cf">প্রতি ঘনফুট</option><option value="cy">প্রতি ঘনগজ</option></select>
  </div>
  <button class="ghost" id="reset">রিসেট</button>
  <button id="install" style="display:none">📲 অ্যাপ ইন্সটল করুন</button>
</div>

<div class="card res">
  <div style="color:var(--muted);font-size:13px">প্রতি ট্রাকে বালু</div>
  <div class="big" id="cf">০ ঘনফুট</div>
  <div class="line"><span>ওজন (টন)</span><b id="tn">0</b></div>
  <div class="line" id="mrow" style="display:none"><span>মোট টাকা</span><b id="tk">0</b></div>
  <div class="note" id="dim"></div>
  <button id="save">💾 হিসাব সেভ করুন</button>
</div>

<div class="card">
  <h2>📒 হিসাবের তালিকা</h2>
  <div id="hist"></div>
  <button class="ghost" id="clr" style="display:none">সব মুছুন</button>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const bn=(x,d=2)=>(isFinite(x)?x:0).toLocaleString("bn-BD",{maximumFractionDigits:d});
const ft=(a,b)=>(+$(a).value||0)+(+$(b).value||0)/12;
const KEY="truck-sand-history-v1";
let hist=[],cur=null;
try{hist=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(hist))hist=[]}catch(e){hist=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(hist))}catch(e){}}
function sz(a,b){return bn(+$(a).value||0,2)+" ফুট "+bn(+$(b).value||0,2)+" ইঞ্চি"}
function calc(){
  const l=ft("lf","li"),w=ft("wf","wi"),h=ft("hf","hi");
  const fe=$("ff").value===""&&$("fi").value==="";
  const f=fe?h:ft("ff","fi");
  $("cw").style.display=$("s").value==="custom"?"block":"none";
  const d=$("s").value==="custom"?(+$("c").value||0):+$("s").value;
  const cf=l*w*f, cy=cf/27, tn=cf*d/2000;
  const p=+$("p").value||0;
  const money=p>0?(($("pu").value==="cf")?cf*p:cy*p):0;
  $("cf").textContent=bn(cf)+" ঘনফুট";$("tn").textContent=bn(tn);
  $("mrow").style.display=p>0?"flex":"none";
  $("tk").textContent="৳ "+bn(money,0);
  $("dim").textContent="দশমিক ফুটে মাপ: দৈর্ঘ্য "+bn(l,3)+" × প্রস্থ "+bn(w,3)+" × উচ্চতা "+bn(f,3);
  const r=h>0?f/h:0;
  $("sandR").style.transform="scaleY("+Math.max(0,Math.min(r,1))+")";
  const pc=$("pct");
  if(r>1){pc.textContent="⚠️ বেডের চেয়ে বেশি ("+bn(r*100,0)+"%)";pc.className="pct warn"}
  else{pc.textContent=bn(r*100,0)+"% ভরা";pc.className="pct"}
  cur={t:Date.now(),L:sz("lf","li"),W:sz("wf","wi"),H:sz("hf","hi"),F:fe?"পুরো ভরা":sz("ff","fi"),cf:cf,cy:cy,tn:tn,tk:p>0?money:null};
}
function render(){
  const box=$("hist");box.textContent="";
  $("clr").style.display=hist.length?"block":"none";
  if(!hist.length){const e=document.createElement("div");e.className="note";e.textContent="এখনো কোনো হিসাব সেভ করা হয়নি।";box.appendChild(e);return}
  hist.forEach((x,i)=>{
    const d=document.createElement("div");d.className="h";
    const hd=document.createElement("div");hd.className="hh";
    const dt=document.createElement("span");dt.textContent=new Date(x.t).toLocaleString("bn-BD",{dateStyle:"medium",timeStyle:"short"});
    const bt=document.createElement("button");bt.className="sm";bt.textContent="মুছুন";
    bt.onclick=()=>{hist.splice(i,1);persist();render()};
    hd.append(dt,bt);
    const b=document.createElement("div");
    b.textContent="ট্রাক: "+x.L+" × "+x.W+" × "+x.H+" | ভরা: "+x.F;
    const r=document.createElement("div");r.style.fontWeight="600";
    r.textContent=bn(x.cf)+" ঘনফুট • "+bn(x.tn)+" টন"+(x.tk!=null?" • ৳ "+bn(x.tk,0):"");
    d.append(hd,b,r);box.appendChild(d);
  });
}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",calc));
$("save").onclick=()=>{calc();hist.unshift(cur);if(hist.length>200)hist.pop();persist();render();
  const b=$("save");b.textContent="✅ সেভ হয়েছে";setTimeout(()=>b.textContent="💾 হিসাব সেভ করুন",1200)};
$("clr").onclick=()=>{if(confirm("সব হিসাব মুছে ফেলবেন?")){hist=[];persist();render()}};
$("reset").onclick=()=>{["lf","li","wf","wi","hf","hi"].forEach((k,i)=>$(k).value=[15,11,6,6,7,7][i]);["ff","fi","p"].forEach(k=>$(k).value="");$("s").value="110";$("pu").value="cf";calc()};
calc();render();
let dp=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("install").style.display="block"});
$("install").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("install").style.display="none"};
addEventListener("appinstalled",()=>{$("install").style.display="none"});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
